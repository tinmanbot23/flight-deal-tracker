# Data source: Travelpayouts (Aviasales) cached flight-prices calendar API.
# The cached data has no branded fares or per-segment routing, so the
# main-cabin, connection-minimum, and per-direction duration filters that the
# old Amadeus version supported are not available here.
filters:
  max_price_usd: 1000
  max_stops: 1
  # Rejected if the (marketing/validating) airline is one of: Spirit, Frontier,
  # Allegiant, Avelo, Sun Country, Play, Norse, Breeze, Volaris, VivaAerobus.
  # Cached data exposes only the validating airline, so a blocked *operating*
  # carrier on a codeshare cannot be detected.
  blocked_carriers: [NK, F9, G4, XP, SY, OG, N0, MX, Y4, VB]

api_budget:
  # Skip the run (with a logged warning) if this month's recorded call count
  # plus the planned calls for the run would exceed this. One call fetches a
  # whole month of departure dates for a route, so budgets go far.
  monthly_max_calls: 10000

# Call-budget strategy. Per run:
#   3 origins x (domestic_per_run + international_per_run) destinations
#     x windows_per_run windows x (calendar months spanning each window).
# Destinations rotate deterministically (run counter stored in prices.db),
# so every destination is revisited every ~2.5 days.
rotation:
  domestic_per_run: 2
  international_per_run: 2
  windows_per_run: 1

search:
  currency: usd

ranking:
  history_days: 30
  # Minimum historical offers on a route before the trailing-median value
  # score is used; below this, rank by absolute price (normalized against
  # max_price_usd so the two scales are comparable).
  min_history_offers: 8

alerts:
  threshold_dedupe_hours: 24
  max_threshold_alerts_per_run: 5
