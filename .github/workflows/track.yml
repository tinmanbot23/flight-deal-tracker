name: Track flights

on:
  schedule:
    # 4am / 11am / 6pm EDT (UTC-4). During standard time (EST, UTC-5) these
    # fire at 3am / 10am / 5pm local — see README to adjust.
    - cron: "0 8,15,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Track flights
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'test' }}
        run: python tracker.py

      - name: Rank deals
        run: python rank.py

      - name: Send alerts
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python alerts.py

      - name: Export dashboard data
        run: python export.py

      - name: Generate report
        run: python report.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.db report.md docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: tracker run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
